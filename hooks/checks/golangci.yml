# Default config, used only when the module has no golangci config of its own. Opinionated toward
# small, flat functions: two complexity measures, nesting, length, argument count and early returns.
version: "2"
linters:
  enable: [gocognit, gocyclo, nestif, funlen, dupl, revive, unparam, gocritic, nakedret, errorlint, nilerr, unconvert, misspell]
  settings:
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 4
    funlen:
      lines: 80
      statements: 50
    dupl:
      threshold: 100
    revive:
      rules:
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
  exclusions:
    rules:
      # Table-driven tests are long and repetitive by design.
      - path: _test\.go
        linters: [funlen, dupl]
formatters:
  enable: [gofumpt, gci]
